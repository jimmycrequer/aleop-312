<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Car 312 — Moulin de la Chaussée / Pirmil</title>
<meta name="theme-color" content="#000FA0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#4C63FF" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<style>
/* Palette relevée dans le fascicule Aléop lui-même :
   outremer #000FA0, ciel #DCEBF8, brume #F0F6FC, tilleul #E5EDB4. */
:root {
  color-scheme: light;
  --ground: #F0F6FC;
  --surface: #FFFFFF;
  --ink: #0A1033;
  --muted: #5A6484;
  --rule: #BED4EC;
  --accent: #000FA0;
  --on-accent: #FFFFFF;
  --tint: #DCEBF8;
  --lime: #E5EDB4;
  --on-lime: #464F0C;
  --shade: rgba(0, 15, 160, .12);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground: #070A1C;
    --surface: #0F1430;
    --ink: #E8ECFA;
    --muted: #94A1C7;
    --rule: #2B3468;
    --accent: #4C63FF;
    --on-accent: #FFFFFF;
    --tint: #171E44;
    --lime: #3B4413;
    --on-lime: #DEE8A9;
    --shade: rgba(0, 0, 0, .45);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #070A1C;
  --surface: #0F1430;
  --ink: #E8ECFA;
  --muted: #94A1C7;
  --rule: #2B3468;
  --accent: #4C63FF;
  --on-accent: #FFFFFF;
  --tint: #171E44;
  --lime: #3B4413;
  --on-lime: #DEE8A9;
  --shade: rgba(0, 0, 0, .45);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font: 400 16px/1.5 Barlow, system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}

.page { max-width: 62rem; margin: 0 auto; padding: 0 1rem 3rem; }

/* ---------- bandeau ligne ---------- */

.masthead {
  background: var(--accent);
  color: var(--on-accent);
  margin: 0 -1rem 1.25rem;
  padding: .9rem 1rem;
  display: flex;
  align-items: center;
  gap: .8rem;
}
.badge {
  font: 700 1.55rem/1 "Barlow Semi Condensed", Barlow, sans-serif;
  background: var(--on-accent);
  color: var(--accent);
  padding: .28em .38em .2em;
  letter-spacing: .01em;
}
.route { font-weight: 500; font-size: 1.02rem; line-height: 1.25; }
.route .swap { opacity: .72; padding: 0 .15em; }

/* ---------- barre de date ---------- */

.datebar {
  display: flex;
  align-items: center;
  gap: .5rem;
  flex-wrap: wrap;
}
.datebar button,
.datebar input {
  font: inherit;
  color: var(--ink);
  background: var(--surface);
  border: 1.5px solid var(--rule);
  border-radius: 3px;
  padding: .45rem .6rem;
}
.datebar button { cursor: pointer; min-width: 2.6rem; }
.datebar button:hover { border-color: var(--accent); }
.datebar input { flex: 1 1 11rem; min-width: 0; }
.datebar .today { flex: 0 0 auto; }
:where(button, input, a):focus-visible {
  outline: 2.5px solid var(--accent);
  outline-offset: 2px;
}

.rule-note {
  margin: .7rem 0 0;
  color: var(--muted);
  font-size: .95rem;
}
.rule-note b { color: var(--ink); font-weight: 600; }
.rule-note .vac {
  background: var(--lime);
  color: var(--on-lime);
  font-weight: 600;
  padding: .05em .4em .12em;
  border-radius: 2px;
}

.warn {
  margin: .9rem 0 0;
  padding: .6rem .75rem;
  background: var(--tint);
  border-left: 3px solid var(--accent);
  font-size: .95rem;
}
.warn:empty { display: none; }

/* ---------- les deux sens ---------- */

.directions {
  margin-top: 1.5rem;
  display: grid;
  gap: 1.25rem;
  grid-template-columns: 1fr;
}
@media (min-width: 46rem) {
  .directions { grid-template-columns: 1fr 1fr; gap: 1.5rem; }
}

.dir { background: var(--surface); border: 1.5px solid var(--rule); border-radius: 4px; }
.dir > h2 {
  margin: 0;
  padding: .6rem .9rem;
  font-size: 1rem;
  font-weight: 600;
  border-bottom: 1.5px solid var(--rule);
}
.dir > h2 small { display: block; font-weight: 400; color: var(--muted); font-size: .85rem; }

.legs { list-style: none; margin: 0; padding: 0; }
.legs li + li { border-top: 1px solid var(--rule); }

.leg {
  display: flex;
  align-items: center;
  gap: .6rem;
  padding: .55rem .9rem;
}
.leg time {
  font: 600 1.65rem/1 "Barlow Semi Condensed", Barlow, sans-serif;
  font-variant-numeric: tabular-nums;
  letter-spacing: .005em;
}
.thread { position: relative; flex: 1 1 auto; min-width: 3.5rem; height: 1.4rem; }
.thread::before {
  content: "";
  position: absolute;
  inset: calc(50% - 3px) 0 auto;
  height: 6px;
  background:
    radial-gradient(circle 3px at 3px 50%, var(--rule) 98%, transparent 100%) left / 8px 100% no-repeat,
    radial-gradient(circle 3px at calc(100% - 3px) 50%, var(--rule) 98%, transparent 100%) right / 8px 100% no-repeat,
    linear-gradient(var(--rule), var(--rule)) center / 100% 1.5px no-repeat;
}
.thread span {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  background: var(--surface);
  padding: 0 .4rem;
  font-size: .74rem;
  color: var(--muted);
  white-space: nowrap;
}

.empty { margin: 0; padding: 1.1rem .9rem; color: var(--muted); }

footer {
  margin-top: 2rem;
  color: var(--muted);
  font-size: .85rem;
  line-height: 1.6;
}
</style>
</head>
<body>
<div class="page">

  <header class="masthead">
    <span class="badge">312</span>
    <span class="route">Moulin de la Chaussée<span class="swap"> ⇄ </span>Pirmil</span>
  </header>

  <div class="datebar">
    <button type="button" id="prev" aria-label="Jour précédent">‹</button>
    <input type="date" id="date" aria-label="Date">
    <button type="button" id="next" aria-label="Jour suivant">›</button>
    <button type="button" id="today" class="today">Aujourd’hui</button>
  </div>

  <p class="rule-note" id="note"></p>
  <p class="warn" id="warn"></p>

  <div class="directions" id="directions"></div>

  <footer id="footer"></footer>

</div>

<script src="data.js"></script>
<script>
(function () {
  "use strict";

  var D = window.SCHEDULES;
  var JOURS = ["dimanche", "lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi"];
  var MOIS = ["janvier", "février", "mars", "avril", "mai", "juin",
              "juillet", "août", "septembre", "octobre", "novembre", "décembre"];

  var elDate = document.getElementById("date");
  var elNote = document.getElementById("note");
  var elWarn = document.getElementById("warn");
  var elDirs = document.getElementById("directions");

  function iso(d) {
    return d.getFullYear() + "-" +
      String(d.getMonth() + 1).padStart(2, "0") + "-" +
      String(d.getDate()).padStart(2, "0");
  }

  function fromIso(s) {
    var p = s.split("-");
    return new Date(+p[0], +p[1] - 1, +p[2]);
  }

  function longDate(s) {
    var d = fromIso(s);
    return JOURS[d.getDay()] + " " + (d.getDate() === 1 ? "1er" : d.getDate()) +
      " " + MOIS[d.getMonth()] + " " + d.getFullYear();
  }

  function minutes(hhmm) {
    var p = hhmm.split(":");
    return +p[0] * 60 + +p[1];
  }

  /* Applique les règles imprimées sur le fascicule : un jour férié roule comme
     un dimanche, et les périodes de vacances basculent la colonne utilisée. */
  function resolve(s) {
    var ctx = { date: s, ferie: D.feries[s] || null, conge: null };
    ctx.horsPeriode = s < D.validity.start || s > D.validity.end;
    ctx.sansService = D.sansService[s] || null;
    for (var i = 0; i < D.vacances.length; i++) {
      if (s >= D.vacances[i].debut && s <= D.vacances[i].fin) { ctx.conge = D.vacances[i]; break; }
    }
    var jour = fromIso(s).getDay();
    ctx.jour = ctx.ferie ? 7 : (jour === 0 ? 7 : jour);
    return ctx;
  }

  function tripsFor(ctx, dir) {
    if (ctx.sansService || ctx.horsPeriode) return [];
    return D.trips.filter(function (t) {
      return t.dir === dir &&
        t.days.indexOf(ctx.jour) !== -1 &&
        (ctx.conge ? t.vacances : t.scolaire);
    }).sort(function (a, b) { return minutes(a.dep) - minutes(b.dep); });
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function renderNote(ctx) {
    elNote.textContent = "";
    var jour = el("b", null, longDate(ctx.date));
    elNote.appendChild(jour);
    if (ctx.sansService) {
      elNote.appendChild(document.createTextNode(" — aucun service."));
      return;
    }
    if (ctx.ferie) {
      elNote.appendChild(document.createTextNode(" — " + ctx.ferie + ", le car circule comme un dimanche."));
    }
    if (ctx.conge) {
      elNote.appendChild(document.createTextNode(ctx.ferie ? " " : " — "));
      elNote.appendChild(el("span", "vac", ctx.conge.nom));
      elNote.appendChild(document.createTextNode(ctx.ferie ? "." : " : horaires de vacances."));
    } else if (!ctx.ferie) {
      elNote.appendChild(document.createTextNode(" — période scolaire."));
    }
  }

  function renderDirection(ctx, dir, titre, sous) {
    var box = el("section", "dir");
    var h = el("h2", null, titre);
    h.appendChild(el("small", null, sous));
    box.appendChild(h);

    var list = tripsFor(ctx, dir);
    if (!list.length) {
      box.appendChild(el("p", "empty", ctx.sansService
        ? "Aucun service le " + ctx.sansService + "."
        : ctx.horsPeriode ? "Hors période couverte par le fascicule."
        : "Aucun car dans ce sens ce jour-là."));
      return box;
    }

    var ul = el("ul", "legs");
    list.forEach(function (t) {
      var li = document.createElement("li");
      var row = el("div", "leg");
      row.appendChild(el("time", null, t.dep));
      var th = el("span", "thread");
      th.appendChild(el("span", null, (minutes(t.arr) - minutes(t.dep)) + " min"));
      row.appendChild(th);
      row.appendChild(el("time", null, t.arr));
      li.appendChild(row);
      ul.appendChild(li);
    });
    box.appendChild(ul);
    return box;
  }

  function render() {
    var s = elDate.value;
    if (!s) return;
    var ctx = resolve(s);
    renderNote(ctx);

    elWarn.textContent = ctx.horsPeriode
      ? "Ce fascicule couvre du " + longDate(D.validity.start) + " au " + longDate(D.validity.end) + "."
      : "";

    elDirs.textContent = "";
    elDirs.appendChild(renderDirection(ctx, "nantes", "Vers Nantes",
      "Moulin de la Chaussée → Pirmil"));
    elDirs.appendChild(renderDirection(ctx, "philbert", "Vers Saint-Philbert",
      "Pirmil → Moulin de la Chaussée"));
  }

  function shift(days) {
    var d = fromIso(elDate.value);
    d.setDate(d.getDate() + days);
    elDate.value = iso(d);
    render();
  }

  document.getElementById("prev").onclick = function () { shift(-1); };
  document.getElementById("next").onclick = function () { shift(1); };
  document.getElementById("today").onclick = function () {
    elDate.value = iso(new Date());
    render();
  };
  elDate.onchange = render;

  elDate.min = D.validity.start;
  elDate.max = D.validity.end;
  elDate.value = iso(new Date());

  var pied = "Ligne " + D.line + " Aléop, horaires du " + longDate(D.validity.start) +
    " au " + longDate(D.validity.end) + ". Les arrêts intermédiaires ne sont pas affichés : " +
    "seules les courses desservant les deux arrêts apparaissent.";

  /* Le service worker n'est possible qu'en http(s) : ouvert en file://, la page
     marche déjà hors ligne, il n'y a rien à installer. */
  if ("serviceWorker" in navigator && location.protocol !== "file:") {
    navigator.serviceWorker.register("sw.js").then(function () {
      document.getElementById("footer").textContent = pied +
        " Ajoutez la page à votre écran d’accueil pour la consulter hors ligne.";
    }, function () { /* pas de sw.js à côté de la page : sans conséquence */ });
  }

  document.getElementById("footer").textContent = pied;
  render();
})();
</script>
</body>
</html>
